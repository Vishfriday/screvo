name: Android APK

# Build the shareable APK on GitHub's machines rather than a laptop: the app is
# an Expo project with a local native module, and `prebuild` regenerates the
# android/ project from app.config.js, so nothing about the native project
# needs to live in this repo.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the Android SDK the runner already has
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -3
          # the image ships the SDK with licences accepted; Gradle fetches any
          # NDK or CMake version the template asks for
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: "1"

      - name: Build the release APK
        working-directory: android
        # arm64 and 32-bit ARM cover real phones; the x86 variants only matter
        # for emulators and would roughly double the NDK time
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name it after the commit
        id: name
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/screvo-${GITHUB_SHA::7}.apk"
          echo "size=$(du -h "out/screvo-${GITHUB_SHA::7}.apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: screvo-apk
          path: out/*.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### Screvo APK built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- commit \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- size ${{ steps.name.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- arm64-v8a + armeabi-v7a, signed with the debug keystore (sideload only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download it from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY
